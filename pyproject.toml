[project]
name = "gradwarden"
version = "0.1.0"
description = "Training-dynamics monitoring for JAX Transformers, with an LLM agent that diagnoses and patches instabilities."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Christopher Rrapi", email = "39552369+crrapi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.6",
    "flax>=0.10",
    "optax>=0.2.4",
    "numpy>=1.26",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.scripts]
gradwarden = "gradwarden.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
